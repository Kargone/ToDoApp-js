<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>ToDo</title>
  <script>
    // Apply the saved or system theme before first paint (mirrors resolveTheme in view-logic.mjs).
    (function () {
      var prefersDark = false;
      var stored = null;
      try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      try { stored = localStorage.getItem('todo-theme'); } catch (e) {}
      var theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0E0E10' : '#FFFFFF');
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="sign-in-shell" class="signin">
    <div class="signin__top">
      <span class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        ToDo
      </span>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme">
        <svg class="icon theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>

    <div class="signin__body">
      <h1>Everything due, in the order it's due.</h1>
      <p>Tasks, events and repeating chores sorted into Today, Tomorrow and beyond. Synced across your devices.</p>
      <button id="sign-in-button" type="button" class="btn btn-outline">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7H2.2a11 11 0 0 0 0 9.9l3.6-2.7z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.2 7l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="signin__foot">Synced with Firebase</p>
  </section>

  <div id="app-shell" class="hidden">
    <header class="app-header">
      <span class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        ToDo
      </span>
      <span class="app-header__spacer"></span>
      <button id="search-button" type="button" class="icon-btn" aria-label="Search" aria-expanded="false" aria-controls="search-toolbar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      </button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme">
        <svg class="icon theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button id="account-button" type="button" class="icon-btn" aria-label="Account" aria-haspopup="menu" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>
      </button>
    </header>

    <div id="search-toolbar" class="search-bar hidden">
      <label class="search-bar__field">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <span class="visually-hidden">Search this list</span>
        <input id="search-input" type="search" placeholder="Search this list" autocomplete="off" />
      </label>
    </div>

    <main class="app-main">
      <div class="day-head">
        <div>
          <p id="day-date" class="day-head__date"></p>
          <h1 id="day-title" class="day-head__title">Today</h1>
        </div>
        <span id="day-count" class="day-head__count"></span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Lists">
        <button type="button" class="tab active" role="tab" data-tab="today">Today<span class="tab__count" data-count-for="today"></span></button>
        <button type="button" class="tab" role="tab" data-tab="tomorrow">Tomorrow<span class="tab__count" data-count-for="tomorrow"></span></button>
        <button type="button" class="tab" role="tab" data-tab="next3">Next 3 days<span class="tab__count" data-count-for="next3"></span></button>
        <button type="button" class="tab" role="tab" data-tab="nextMonth">Next month<span class="tab__count" data-count-for="nextMonth"></span></button>
        <button type="button" class="tab" role="tab" data-tab="later">Later<span class="tab__count" data-count-for="later"></span></button>
        <button type="button" class="tab" role="tab" data-tab="projects">Projects<span class="tab__count" data-count-for="projects"></span></button>
        <button type="button" class="tab" role="tab" data-tab="repeating">Repeating<span class="tab__count" data-count-for="repeating"></span></button>
        <button type="button" class="tab" role="tab" data-tab="completed">Completed<span class="tab__count" data-count-for="completed"></span></button>
      </nav>

      <ul id="todo-list" class="list"></ul>
      <p id="empty-state" class="empty-state">Nothing here.</p>

      <div class="list-actions">
        <span class="list-actions__hint">Press<span class="kbd">N</span>to add</span>
        <button id="new-project-button" type="button" class="btn btn-outline hidden">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
          New project
        </button>
        <button id="new-item-button" type="button" class="btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New item
        </button>
      </div>
    </main>
  </div>

  <dialog id="add-sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet__grab" aria-hidden="true"></div>
    <form id="todo-form">
      <div class="sheet__head">
        <h2 id="sheet-title">New item</h2>
        <div class="seg" role="group" aria-label="Item type">
          <button id="type-task" type="button" class="seg__opt" aria-pressed="true">Task</button>
          <button id="type-event" type="button" class="seg__opt" aria-pressed="false">Event</button>
        </div>
        <select id="item-type" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <option value="task">Task</option>
          <option value="event">Event</option>
        </select>
      </div>

      <label for="todo-input" class="visually-hidden">Title</label>
      <input id="todo-input" class="sheet__title" type="text" placeholder="What needs doing?" autocomplete="off" />

      <div class="field-row item-task">
        <div class="field">
          <label for="due-date">Due day</label>
          <input id="due-date" type="date" />
        </div>
        <div class="field">
          <label for="due-time">Time <span>(optional)</span></label>
          <input id="due-time" type="time" />
        </div>
      </div>

      <div class="field-row item-event hidden">
        <div class="field">
          <label for="start-date">Start day</label>
          <input id="start-date" type="date" />
        </div>
        <div class="field">
          <label for="start-time">Start time</label>
          <input id="start-time" type="time" />
        </div>
      </div>

      <div class="field-row item-event hidden">
        <div class="field">
          <label for="end-time">End time</label>
          <input id="end-time" type="time" />
        </div>
      </div>

      <div class="item-task" id="task-section-row">
        <label class="switch">
          No due date
          <input id="no-due" type="checkbox" />
        </label>
        <div class="field hidden" id="task-section-field" style="margin-top: 10px">
          <label for="task-section">Place in</label>
          <select id="task-section">
            <option value="today">Today</option>
            <option value="later">Later</option>
          </select>
        </div>
      </div>

      <div id="project-row" class="hidden">
        <div class="field">
          <label for="project-select">Project</label>
          <select id="project-select">
            <option value="">No project</option>
          </select>
        </div>
        <label class="switch hidden" id="date-tabs-switch" style="margin-top: 10px">
          Also show in date tabs
          <input id="in-date-tabs" type="checkbox" />
        </label>
      </div>

      <div class="sheet__divider"></div>

      <label class="switch">
        Repeat
        <input id="repeat-task" type="checkbox" />
      </label>

      <div class="repeat-controls hidden" id="repeat-controls">
        <div class="field-row">
          <div class="field">
            <label for="repeat-interval">Every</label>
            <div class="field-inline">
              <input id="repeat-interval" type="number" min="1" value="1" />
              <select id="repeat-unit" aria-label="Repeat unit">
                <option value="day">Day(s)</option>
                <option value="week">Week(s)</option>
                <option value="month">Month(s)</option>
                <option value="year">Year(s)</option>
              </select>
            </div>
          </div>
          <div class="field" id="repeat-time-row">
            <label for="repeat-time">Reveal time <span>(optional)</span></label>
            <input id="repeat-time" type="time" />
          </div>
        </div>

        <div class="field hidden" id="repeat-weekday-field">
          <span class="field-label">Repeat on</span>
          <div class="weekday-pill-grid">
            <button type="button" class="weekday-pill selected" data-day="0">Sun</button>
            <button type="button" class="weekday-pill selected" data-day="1">Mon</button>
            <button type="button" class="weekday-pill selected" data-day="2">Tue</button>
            <button type="button" class="weekday-pill selected" data-day="3">Wed</button>
            <button type="button" class="weekday-pill selected" data-day="4">Thu</button>
            <button type="button" class="weekday-pill selected" data-day="5">Fri</button>
            <button type="button" class="weekday-pill selected" data-day="6">Sat</button>
          </div>
        </div>

        <div class="field hidden" id="repeat-monthday-field">
          <label for="repeat-month-pattern">Monthly pattern</label>
          <select id="repeat-month-pattern">
            <option value="days">Days of month</option>
            <option value="weekday">Week of month</option>
          </select>
        </div>

        <div class="field hidden" id="repeat-month-days-field">
          <label for="repeat-monthdays">Days of month</label>
          <input id="repeat-monthdays" type="text" placeholder="e.g. 1, 15, 28" />
        </div>

        <div class="field hidden" id="repeat-month-week-field">
          <span class="field-label">Week of month</span>
          <div class="weekday-pill-grid month-week-grid">
            <button type="button" class="weekday-pill selected" data-week="1">1st</button>
            <button type="button" class="weekday-pill" data-week="2">2nd</button>
            <button type="button" class="weekday-pill" data-week="3">3rd</button>
            <button type="button" class="weekday-pill" data-week="4">4th</button>
            <button type="button" class="weekday-pill" data-week="5">5th</button>
          </div>
        </div>

        <div class="field hidden" id="repeat-month-weekday-field">
          <span class="field-label">Day of week</span>
          <div class="weekday-pill-grid">
            <button type="button" class="weekday-pill selected" data-day="0">Sun</button>
            <button type="button" class="weekday-pill" data-day="1">Mon</button>
            <button type="button" class="weekday-pill" data-day="2">Tue</button>
            <button type="button" class="weekday-pill" data-day="3">Wed</button>
            <button type="button" class="weekday-pill" data-day="4">Thu</button>
            <button type="button" class="weekday-pill" data-day="5">Fri</button>
            <button type="button" class="weekday-pill" data-day="6">Sat</button>
          </div>
        </div>

        <div class="field">
          <label for="repeat-end">Stop on <span>(optional)</span></label>
          <input id="repeat-end" type="date" />
        </div>
      </div>

      <div id="alarm-row">
        <div class="sheet__divider"></div>
        <label class="switch">
          Alarm
          <input id="alarm-task" type="checkbox" />
        </label>
        <div class="field hidden" id="alarm-controls" style="margin-top: 10px">
          <label for="alarm-time">Ring at</label>
          <input id="alarm-time" type="time" />
        </div>
      </div>

      <div class="sheet__foot">
        <button id="sheet-cancel" type="button" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn">Add</button>
      </div>
    </form>
  </dialog>

  <script src="script.mjs" type="module"></script>
</body>
</html>
